# Alert rules - check them at http://localhost:9090/alerts
groups:
  - name: position-service
    rules:
      - alert: InstanceDown
        expr: up{job="position-service"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "position-service is not being scraped"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[1m]))
            / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests fail"

      - alert: SlowP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[1m]))) > 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 1s"

      - alert: DbPoolStarvation
        expr: max(hikaricp_connections_pending) > 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Requests are waiting for a DB connection"

      - alert: HeapAlmostFull
        expr: |
          sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Heap usage above 85%"
