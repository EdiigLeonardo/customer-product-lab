# PostgreSQL 16 (open source). The scripts in ./sql run automatically on first start.
services:
  db:
    image: postgres:16
    container_name: lab-riskdb
    environment:
      POSTGRES_DB: riskdb
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports: ["5432:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
